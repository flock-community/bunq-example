name: Build pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: create sandbox API key
        shell: bash
        run: |
          key=$(curl -sf -X POST https://public-api.sandbox.bunq.com/v1/sandbox-user-person -H 'Content-Type: application/json' -H 'User-Agent: bunq-example' -d '{}' | jq -er '.Response[0].ApiKey.api_key')
          echo "::add-mask::$key"
          echo "BUNQ_API_KEY=$key" >> "$GITHUB_ENV"
      - name: build
        run: |
          ./gradlew build
